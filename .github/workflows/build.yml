name: Build Qt application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows executable
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ''

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build release executables
        run: cmake --build build --config Release --parallel

      - name: Bundle Qt DLLs
        shell: pwsh
        run: |
          $appExe = Get-ChildItem -Path build -Filter QtChatApp.exe -Recurse | Select-Object -First 1
          if ($null -eq $appExe) { throw "QtChatApp.exe introuvable" }
          $relayExe = Get-ChildItem -Path build -Filter QtChatRelay.exe -Recurse | Select-Object -First 1
          if ($null -eq $relayExe) { throw "QtChatRelay.exe introuvable" }

          windeployqt --release --compiler-runtime $appExe.FullName
          windeployqt --release --compiler-runtime $relayExe.FullName

          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item -Path (Join-Path $appExe.DirectoryName '*') -Destination 'dist/windows' -Recurse -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtChatApp-Windows-x64
          path: dist/windows
          if-no-files-found: error

  build-linux:
    name: Linux executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Linux executables
        run: cmake --build build --parallel

      - name: Package Linux artifact
        run: |
          mkdir -p dist/linux
          cp build/QtChatApp dist/linux/
          cp build/QtChatRelay dist/linux/
          chmod +x dist/linux/QtChatApp dist/linux/QtChatRelay

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtChatApp-Linux-x64
          path: dist/linux
          if-no-files-found: error
